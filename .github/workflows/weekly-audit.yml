name: Audit hebdomadaire

# Audit non bloquant : liens externes et qualité des pages (Lighthouse).
# Un échec n'empêche rien — il signale qu'un lien externe est mort ou
# qu'une page a régressé (performance, SEO, accessibilité).

on:
  schedule:
    - cron: '0 6 * * 1'   # tous les lundis à 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liens-externes:
    name: Liens externes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérification des liens externes (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir : sans lui, lychee ne peut pas résoudre les liens commençant
          # par "/" (ex. /mentions-legales.html) et les signale à tort en erreur.
          # template.html : gabarits du pipeline de publication, contiennent des
          # placeholders {{SLUG}} etc. non substitués, ce ne sont pas de vraies pages.
          # economie.gouv.fr : bloque les requêtes automatisées via un challenge
          # Cloudflare (cf-mitigated: challenge) ; le site est en ligne.
          # iso.org : renvoie 403 Forbidden à toute requête automatisée (WAF
          # anti-bot), y compris hors CI ; la page est bien accessible dans
          # un navigateur classique.
          args: >-
            --no-progress
            --max-retries 2
            --timeout 20
            --root-dir ${{ github.workspace }}
            --exclude-path .automation
            --exclude-path 'template\.html$'
            --exclude '^mailto:'
            --exclude '(twitter|x)\.com'
            --exclude 'linkedin\.com'
            --exclude 'wa\.me'
            --exclude 'economie\.gouv\.fr'
            --exclude 'iso\.org'
            '**/*.html'
          fail: true

  lighthouse:
    name: Lighthouse (performance, SEO, accessibilité)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .github/lighthouse/lighthouserc.json
          uploadArtifacts: true
